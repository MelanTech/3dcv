filter:
  type: depth
  # 离线视频评估使用配置内参；这里使用采集相机的 color 内参，
  # 对应深度已对齐到彩色图后的 RGB 像素坐标系。
  intrinsic:
    width: 640
    height: 480
    fx: 577.8551635742188
    fy: 577.8551635742188
    cx: 315.8110656738281
    cy: 234.57275390625

  depth_filter:
    object_depth:
      coord_sample_num: 20
      min_valid_pixels: 5
      expand_ratios: [0.15, 0.3]
      table_plane_fallback: true
      plane_offset_m: 0.0

    filtering:
      keep_table: true
      use_support_point: true
      # 脚点真实深度比桌面平面交点远出该阈值(米)时，判定为紧邻桌子的地面物品并过滤；
      # 桌面上的高叠物品脚点仍贴合平面，不受影响。<=0 关闭。
      ground_reject_gap_m: 0.05
      ground_reject_band_ratio: 0.15      # 脚点深度取 bbox 底部该比例高度的横带（兼容斜放物体）
      ground_reject_near_percentile: 25.0 # 用该较近分位数代表脚点深度，抑制透出背景的远端噪声
      ground_reject_max_gap_m: 0.0        # <=0 表示不设上限；脚点深度明显远于桌面平面时始终按地面/背景过滤
      reproject_recover: true             # 交点落桌外时用真实深度反投影中心复核，纠正高/边缘物体横向漂移
      reproject_min_height_m: 0.08         # 复核只对真实高度超过该值(米)的高物体启用，避免误救桌外物品

    visualization:
      enabled: false
      window:
        width: 640
        height: 480
      depth_trunc_m: 2.0
      point_cloud_stride: 2
      show_detection_boxes: true
      detection_box_depth_mode: median
      table_box_height_m: 0.06
      point_size: 6.0            # 标记点/点云渲染尺寸，放大便于观察
      color_by_keep: true        # 标记点按过滤结果染色：绿=保留，红=被过滤
      line_width: 4.0            # bbox / 桌面范围线框宽度
      show_labels: true          # 在 bbox 上方显示物品类别文字标签

    plane_fit:
      enabled: true
      sample_stride: 4
      max_points: 3000
      min_points: 80
      ransac_iterations: 80
      update_interval_frames: 2
      early_stop_inlier_ratio: 0.75
      distance_thresh_m: 0.015
      min_inlier_ratio: 0.35
      use_unmasked_points_for_orientation: true
      roi_shrink_ratio: 0.04

    footprint:
      mode: by_table
      table_modes:
        1: rectangle
        2: rectangle
        3: ellipse
      range_percentile: 2.0
      size_scale: 1.0
      range_margin_m: 0.05
      vertical_expansion:
        enabled: true
        angle_deg: 35.0
        max_extra_margin_m: 0.05
        min_height_m: 0.0
      round_fill_ratio_max: 0.88
      round_corner_ratio_max: 0.03
      switch_min_frames: 3

    smoothing:
      alpha: 0.25
      reset_distance_m: 0.35
      reject_distance_m: 0.12
      reject_angle_deg: 18.0
      reject_size_ratio: 1.8
      hold_on_failure: true
      max_hold_frames: 8

    fallback:
      dynamic_scale: 0.8
