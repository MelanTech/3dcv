team:
  file_prefix: USTB-MQMM5
  team_id: Y2607T1733227

logging:
  base_dir: runs/logs
  console: true
  per_frame: false

pipeline:
  async_detector:
    # OrangePi only: a spawned process owns an independent ACL detector context.
    # The main process continues the prior frame's depth/OCR/counter stages.
    enabled: true

visualization:
  enabled: true
  type: opencv
  mode: rgb_depth_overlay
  window_name: 3DCV
  depth_max_mm: 5000
  depth_overlay_alpha: 0.45
  wait_key_ms: 1
  draw_labels: true
  draw_status_label: true
  draw_state_label: true
  overlay_text_scale: 0.45
  overlay_line_height: 18
  fps_smoothing: 0.8
  count_gui:
    enabled: true
    window_name: 3DCV Counts
    fps_smoothing: 0.8
  stages: # Available stages: preview, detect, track, locate, filter, ocr, final.
    # - preview
#    - detect
    # - track
    # - locate
    # - filter
    # - ocr
#    - final

state_machine: !include state_machine/default.yaml
frame_source: !include frame_source/eval_videos.yaml
referee: !include referee/disabled.yaml
class_registry: !include class_registry/default.yaml
detector: !include detector/yolo/yolo26.yaml
unknown_merger: !include unknown_merger/default.yaml
table_locator: !include table_locator/default.yaml
filter: !include filter/depth_filter.yaml
ocr: !include ocr/paddleocrv6.yaml
counter: !include counter/consensus.yaml
