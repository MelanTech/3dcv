ocr:
  type: paddle
  version: ppocrv6-small-no-doc-orientation
  use_angle_cls: true
  use_doc_orientation: false
  use_gpu: false

  enlarge: 1.0
  min_match_score: 60.0
  min_text_length: 2

  engine:
    backend: auto
    det_model_dir: models/ppocrv6/det.onnx
    rec_model_dir: models/ppocrv6/rec.onnx
    cls_model_dir: models/ppocrv5/cls.onnx
    rec_char_dict_path: models/ppocrv6/ppocrv6_dict.txt
    det_db_thresh: 0.2
    det_db_box_thresh: 0.45
    det_db_unclip_ratio: 1.4
    det_box_type: quad
